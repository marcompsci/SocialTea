# Fallback: if the bundled .xcodeproj ever gives you trouble, run `xcodegen` in this folder.
name: SocialTea
options:
  bundleIdPrefix: com.phoronomics
  deploymentTarget:
    iOS: "17.0"
targets:
  SocialTea:
    type: application
    platform: iOS
    sources: [SocialTea]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.socialtea
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SocialTea
        INFOPLIST_KEY_NSFaceIDUsageDescription: SocialTea uses Face ID only to unlock the app when you turn on App Lock.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  SocialTeaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SocialTeaTests]
    dependencies:
      - target: SocialTea
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
